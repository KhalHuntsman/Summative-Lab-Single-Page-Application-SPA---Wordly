<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Wordly Dictionary</h1>
  </header>

  <main>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Enter a word..." aria-label="Search Word">
      <button type="submit">Search</button>
    </form>

    <section id="results">
      <!-- Dynamic content (definitions, synonyms, pronunciation, audio) will appear here -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
